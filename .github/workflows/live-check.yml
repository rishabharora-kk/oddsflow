name: live-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run live-check
        env:
          PANTA_API_KEY: ${{ secrets.PANTA_API_KEY }}
          SOLAMI_API_KEY: ${{ secrets.SOLAMI_API_KEY }}
          ODDSFLOW_DIAG: "1"
          ODDSFLOW_MAX_DETAILS: "200"
